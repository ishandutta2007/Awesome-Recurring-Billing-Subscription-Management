<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.8" />
    </linearGradient>

    <!-- Filter for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
      letter-spacing: 0.8px;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .stat-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 12px;
      fill: #64748b;
    }
    .stat-val {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 17px;
      fill: #38bdf8;
    }

    /* CSS Animations for Dynamic Feel */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatDelayed {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes dashCycle {
      to { stroke-dashoffset: -40; }
    }
    @keyframes spinWheel {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .pulse-layer {
      transform-origin: 950px 210px;
      animation: pulseGlow 6s ease-in-out infinite;
    }
    .float-card1 {
      animation: floatSlow 5s ease-in-out infinite;
    }
    .float-card2 {
      animation: floatDelayed 6s ease-in-out infinite;
    }
    .cycle-line {
      stroke-dasharray: 8, 8;
      animation: dashCycle 2.5s linear infinite;
    }
    .spinning-circle {
      transform-origin: 1040px 105px;
      animation: spinWheel 18s linear infinite;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Grid Lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="200" y1="0" x2="200" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="800" y1="0" x2="800" y2="420" />
    <line x1="1000" y1="0" x2="1000" y2="420" />
  </g>

  <!-- Dynamic Glowing Orbs in Background -->
  <circle cx="980" cy="210" r="150" fill="#6366f1" opacity="0.25" filter="url(#softGlow)" class="pulse-layer" />
  <circle cx="1100" cy="90" r="90" fill="#06b6d4" opacity="0.2" filter="url(#softGlow)" class="pulse-layer" />

  <!-- Animated Orbiting/Spinning Element in Background (Safe off to right side) -->
  <g class="spinning-circle" opacity="0.35">
    <circle cx="1040" cy="105" r="55" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="8, 12" />
    <circle cx="1040" cy="50" r="5" fill="#38bdf8" />
    <circle cx="1040" cy="160" r="4" fill="#c084fc" />
  </g>

  <!-- Interactive Graphic Floating Cards (Right Hand Side) -->
  <!-- Floating Card 1: Subscription Lifecycle -->
  <g class="float-card1">
    <g transform="translate(760, 75)">
      <rect width="360" height="110" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
      <rect width="360" height="110" rx="14" fill="url(#cardGrad)" />
      
      <!-- Icon Indicator -->
      <circle cx="40" cy="40" r="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
      <path d="M33 40 L38 45 L48 35" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Card Texts -->
      <text x="70" y="36" class="pill-text" font-size="14">Recurring Billing Engine</text>
      <text x="70" y="55" class="stat-label">Automated Invoicing &amp; Dunning</text>
      
      <!-- Progress Bar Graphic -->
      <rect x="70" y="72" width="260" height="8" rx="4" fill="#1e293b" />
      <rect x="70" y="72" width="200" height="8" rx="4" fill="url(#flowGrad)" />
      <circle cx="270" cy="76" r="6" fill="#34d399" filter="url(#glow)" />
      <text x="290" y="65" font-family="sans-serif" font-size="11" fill="#34d399" font-weight="700">99.9%</text>
    </g>
  </g>

  <!-- Flowing Cycle Line Connecting Cards -->
  <path d="M940 185 C940 210, 890 205, 890 230" fill="none" stroke="#818cf8" stroke-width="2" class="cycle-line" opacity="0.7" />

  <!-- Floating Card 2: Revenue Metrics -->
  <g class="float-card2">
    <g transform="translate(720, 230)">
      <rect width="400" height="115" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
      <rect width="400" height="115" rx="14" fill="url(#cardGrad)" />

      <!-- Mini Sparkline Graph -->
      <path d="M30 85 L65 72 L100 78 L135 55 L170 60 L205 38 L240 45 L275 25" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
      <path d="M30 85 L65 72 L100 78 L135 55 L170 60 L205 38 L240 45 L275 25 L275 95 L30 95 Z" fill="url(#flowGrad)" opacity="0.15" />

      <!-- Metric Highlights -->
      <g transform="translate(290, 32)">
        <text x="0" y="0" class="stat-label">ANNUAL REVENUE</text>
        <text x="0" y="22" class="stat-val">$18.8B+</text>
        <text x="0" y="42" class="stat-label">GLOBAL MARKET</text>
        <text x="0" y="60" font-family="sans-serif" font-size="12" fill="#34d399" font-weight="700">↗ +16.2% CAGR</text>
      </g>
    </g>
  </g>

  <!-- Left Side: Main Title & SEO Description (Foreground, Clean & Legible) -->
  <g transform="translate(70, 75)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="220" height="30" rx="15" fill="#0369a1" fill-opacity="0.25" stroke="#0284c7" stroke-width="1" />
    <circle cx="15" cy="15" r="4" fill="#38bdf8" filter="url(#glow)" />
    <text x="28" y="20" class="badge-text">CURATED DIRECTORY 2026</text>

    <!-- Main Title -->
    <text x="0" y="80" class="title">
      Awesome Recurring Billing &amp;
    </text>
    <text x="0" y="130" class="title" fill="url(#accentGrad)">
      Subscription Management
    </text>

    <!-- Subtitle -->
    <text x="0" y="172" class="subtitle">
      A battle-tested catalog of open-source engines, enterprise billing
    </text>
    <text x="0" y="198" class="subtitle">
      platforms, and modern SaaS monetization infrastructure.
    </text>

    <!-- Feature Tags / Pills -->
    <g transform="translate(0, 230)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="130" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="20" y="20" class="pill-text">⚡ Metering</text>

      <!-- Pill 2 -->
      <rect x="142" y="0" width="138" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="160" y="20" class="pill-text">💳 Invoicing</text>

      <!-- Pill 3 -->
      <rect x="292" y="0" width="168" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="310" y="20" class="pill-text">🔄 Churn Recovery</text>

      <!-- Pill 4 -->
      <rect x="472" y="0" width="145" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="490" y="20" class="pill-text">🌐 Self-Hosted</text>
    </g>
  </g>

  <!-- Bottom Accent Border -->
  <rect x="0" y="415" width="1200" height="5" fill="url(#accentGrad)" />
</svg>
